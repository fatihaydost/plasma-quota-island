name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: metadata.json is valid JSON
        run: python -m json.tool package/metadata.json > /dev/null
      - name: Unit tests
        run: python -m unittest discover -s tests -v
